# Runs the backend test suite on every push/PR touching backend code.
# Keeps `develop` green — the shipping gate (CLAUDE.md) depends on tests passing.
name: CI

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # No ANTHROPIC_API_KEY in CI — tests must not make live AI calls. The suite
        # covers pure logic (url/platform/vtt parsing, rate limiter, response coercion).
        run: python -m pytest tests/ -q
