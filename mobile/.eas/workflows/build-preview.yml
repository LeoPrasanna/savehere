name: Android preview build

# ── WHY THIS EXISTS ────────────────────────────────────────────────────────
# Every round so far has ended with "merge, then go and run eas build by hand,
# then remember to commit the versionCode it wrote back". That last step has
# already been forgotten once, and forgetting it produces a build Android
# REFUSES to install (equal versionCode), discovered ~40 minutes later at the
# end of a queue. Automating it removes the manual step and the failure mode.
#
# ✅ CONFIRMED WORKING 2026-08-14. The EAS GitHub App is connected and the base
# directory is set, so merging to `develop` fires a build on its own.
#
# ⚠️ THE QUEUE IS THE BIGGER COST. Measured from EAS's own `metrics`:
#
#   358c42ae   queue 29.7 min   compute 17.7 min
#   cdbd151b   queue  7.6 min   compute 18.3 min
#   aef10440   queue  5.8 min   compute 26.0 min
#
# Queue spans a 24-minute range, compute an 8-minute one. ⚠️ An earlier version
# of this comment claimed compute was "FLAT... a 3% spread" — that was read off
# the first two rows alone, and the third broke it. Compute varies by ~45%, for
# reasons not established here; do not quote it as a constant.
#
# The conclusion survives the correction: the largest single lever available in
# this repo is not making a build faster — it is not queueing builds that
# cannot change the APK at all.
#
# ⚠️⚠️ THE AUTO-TRIGGER IS OFF, AND THE REASON IS A HARD CEILING, NOT A
# PREFERENCE (2026-08-15).
#
# The EAS Free plan gives **15 Android builds per CALENDAR MONTH** — not the 30
# that a 2023 changelog announced and that everyone still remembers. The 30 was
# pooled with an iOS sub-cap; today's allowance is split per platform
# (15 Android + 15 iOS), and for an Android-only project the 15 iOS builds are
# dead weight. Source: https://expo.dev/pricing.md ("Up to 15 Android and 15
# iOS builds").
#
# ⚠️ **RUNNING OUT IS A WALL, NOT A BILL.** Free plans cannot incur overage:
# "Once you use your monthly quota of free builds, new builds are unavailable
# until the quota resets on the first day of the next calendar month"
# (https://docs.expo.dev/billing/faq/). No pay-per-build escape hatch exists.
# The only unblocks are upgrading to Starter or waiting for the 1st.
#
# On 2026-08-15 this project had used **10 of 15** in four days, with half the
# month left. A `paths` filter alone is not a budget — an auto-trigger spends
# the remaining builds in merge order, which is not the same as spending them
# on the merges that deserve an APK.
#
# So builds are now DELIBERATE:
#
#   cd mobile && npx eas-cli@latest workflow:run .eas/workflows/build-preview.yml
#
# ⚠️ The versionCode write-back that this file was created to automate STILL
# happens — `autoIncrement` runs on the build machine either way, so nothing
# regressed there. What is lost is only the "fires by itself" part.
#
# ── RESTORING THE AUTO-TRIGGER ─────────────────────────────────────────────
# When the budget allows (a paid plan, or a quieter month), uncomment the block
# below. It is kept verbatim rather than deleted because it was verified working
# on 2026-08-14 and the path patterns are non-obvious.
#
# ⚠️ THE PATTERNS ARE WRITTEN TO BE CORRECT UNDER EITHER PATH ROOT. EAS reads
# `.eas/workflows/` relative to the base directory configured for the GitHub
# connection (`mobile` here), and it is NOT documented whether `paths` resolves
# from there or from the repo root. Both readings behave the same way:
#   - repo-root:   `**` matches everything, and the exclusions do real work.
#   - mobile-relative: `**` matches everything under mobile/, the backend/docs/
#     .github exclusions match nothing (harmless), and a merge that touches only
#     those directories never reaches mobile/ so it does not fire anyway.
#
# on:
#   push:
#     branches: ['develop']
#     paths:
#       - '**'
#       - '!**/*.md'        # docs-only merges cannot change the APK
#       - '!backend/**'     # FastAPI ships via Render, not EAS
#       - '!docs/**'
#       - '!.github/**'     # GitHub Actions config; EAS workflows live elsewhere
#       - '!**/.eas/**'     # editing the trigger cannot change the APK

on:
  # Manual only. See the budget note above before removing this.
  # ⚠️ The empty `inputs: {}` is REQUIRED — EAS validates `workflow_dispatch` as
  # an object, and a bare `workflow_dispatch:` (which is valid GitHub Actions)
  # fails with "must be an object but it was null".
  workflow_dispatch:
    inputs: {}

jobs:
  build_android_preview:
    name: Build Android APK (preview)
    type: build
    params:
      platform: android
      profile: preview
