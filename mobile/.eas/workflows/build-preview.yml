name: Android preview build

# ── WHY THIS EXISTS ────────────────────────────────────────────────────────
# Every round so far has ended with "merge, then go and run eas build by hand,
# then remember to commit the versionCode it wrote back". That last step has
# already been forgotten once, and forgetting it produces a build Android
# REFUSES to install (equal versionCode), discovered ~40 minutes later at the
# end of a queue. Automating it removes the manual step and the failure mode.
#
# ✅ CONFIRMED WORKING 2026-08-14. The EAS GitHub App is connected and the base
# directory is set, so merging to `develop` fires a build on its own.
#
# ⚠️ THE QUEUE IS THE BIGGER COST. Measured from EAS's own `metrics`:
#
#   358c42ae   queue 29.7 min   compute 17.7 min
#   cdbd151b   queue  7.6 min   compute 18.3 min
#   aef10440   queue  5.8 min   compute 26.0 min
#
# Queue spans a 24-minute range, compute an 8-minute one. ⚠️ An earlier version
# of this comment claimed compute was "FLAT... a 3% spread" — that was read off
# the first two rows alone, and the third broke it. Compute varies by ~45%, for
# reasons not established here; do not quote it as a constant.
#
# The conclusion survives the correction: the largest single lever available in
# this repo is not making a build faster — it is not queueing builds that
# cannot change the APK at all.
#
# Hence the `paths` filter. On 2026-08-14 two merges landed minutes apart and
# the second was a TODO.md-only change: it queued a full Android build behind
# the first, and EAS cancelled one of them.
#
# ⚠️ THE PATTERNS ARE WRITTEN TO BE CORRECT UNDER EITHER PATH ROOT. EAS reads
# `.eas/workflows/` relative to the base directory configured for the GitHub
# connection (`mobile` here), and it is NOT documented whether `paths` resolves
# from there or from the repo root. Both readings behave the same way:
#   - repo-root:   `**` matches everything, and the exclusions do real work.
#   - mobile-relative: `**` matches everything under mobile/, the backend/docs/
#     .github exclusions match nothing (harmless), and a merge that touches only
#     those directories never reaches mobile/ so it does not fire anyway.
# If a build ever fails to fire for a genuine mobile change, THIS is the first
# thing to suspect — check `eas workflow:run` still works before blaming EAS.

on:
  push:
    branches: ['develop']
    paths:
      - '**'
      - '!**/*.md'        # docs-only merges cannot change the APK
      - '!backend/**'     # FastAPI ships via Render, not EAS
      - '!docs/**'
      - '!.github/**'     # GitHub Actions config; EAS workflows live elsewhere
      # This file. Editing the trigger cannot change the APK, and the first
      # version of this filter proved the point by queueing a 26-minute build
      # for a comment. Test changes here with `eas workflow:run` instead:
      #   npx eas-cli@latest workflow:run .eas/workflows/build-preview.yml
      - '!**/.eas/**'

jobs:
  build_android_preview:
    name: Build Android APK (preview)
    type: build
    params:
      platform: android
      profile: preview
